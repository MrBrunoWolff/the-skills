# Security updates run independently of this weekly version-update schedule.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    assignees: ["MrBrunoWolff"]
    labels: ["dependencies"]
    cooldown:
      default-days: 3
    groups:
      weekly-updates:
        patterns: ["*"]
